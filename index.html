<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }
        .logo svg {
            width: 60px;
            height: 60px;
            fill: white;
        }
        h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .tagline {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        a {
            display: block;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        .footer {
            margin-top: 60px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9em;
        }
        .footer a {
            display: inline;
            background: none;
            border: none;
            padding: 0;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
        }
        .footer a:hover {
            background: none;
            transform: none;
            box-shadow: none;
            color: white;
        }
    </style>
</head>
